syntax = "proto3";
package umsg;

message PointXYZIRL {
    float x = 1;
    float y = 2;
    float z = 3;
    float intensity = 4;
    uint32 ring = 5;
    uint32 label = 6;
}

message PointCloud {
    repeated PointXYZIRL points = 1;
}

message LogEvent
{
    bool log_event = 1;
    string time_stamp = 2;
    string path = 3;
}
message Topic
{
    string topic = 1;
    int32 hz = 2;
    string msg=3;
}
message TopicList
{
    repeated Topic topics = 1;
}